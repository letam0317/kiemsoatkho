<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Xem trước bản đang sửa</title>
<!-- 07/11 user «laptop khởi động lại mỗi ngày → link xem trước đổi mỗi ngày, tìm cách khác»: LINK CỐ ĐỊNH audit-dc /retail/xem-truoc.html.
     Trang hỏi Apps Script (xtLay, bằng phiên tài khoản — chỉ quản trị) địa chỉ đường hầm hiện tại của laptop (duong-ham-xem-truoc.mjs ghi qua xtDat),
     rồi chuyển sang, MANG THEO khoá máy + phiên đăng nhập qua #mang=… (tên miền đường hầm đổi mỗi ngày ⇒ không phải đăng nhập lại).
     ?p=<đường tab> chọn trang mở (mặc định Bảo dưỡng), vd ?p=hangmuc5s/planogram · ?app=factory -->
<style>
:root{--nen:#f5f6f8;--the:#ffffff;--chu:#1f2329;--phu:#646a73;--vien:#dee0e3;--nhan:#1677ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nen:#141414;--the:#1f1f1f;--chu:#e6e6e6;--phu:#a0a4ab;--vien:#303030;--nhan:#4096ff}}
:root[data-theme="dark"]{--nen:#141414;--the:#1f1f1f;--chu:#e6e6e6;--phu:#a0a4ab;--vien:#303030;--nhan:#4096ff}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:20px 22px;max-width:420px;width:100%}
h1{font-size:17px;margin:0 0 6px}
p{margin:0;color:var(--phu)}
a{color:var(--nhan)}
</style>
</head>
<body>
<div class="the"><h1>Xem trước bản đang sửa</h1><p id="tt">Đang tìm bản xem trước trên laptop…</p></div>
<script>
(function () {
  var tt = document.getElementById("tt");
  var GAS = "https://script.google.com/macros/s/AKfycbzIE6E68VYxS0Zm1vj8Ttfd790-JYolO1C4rMoEPj7FdNOWLPb23QpUHgIZ2T_dlZPJRQ/exec";
  var bao = function (h) { tt.innerHTML = h; };
  var ls = null; try { ls = window.localStorage; } catch (e) { ls = null; }
  var phien = ""; try { phien = (ls && ls.getItem("tk-phien")) || ""; } catch (e) { phien = ""; }
  if (!phien) { bao('Chưa đăng nhập trên trình duyệt này. <a href="/retail/">Đăng nhập audit-dc</a> bằng tài khoản quản trị rồi mở lại link này.'); return; }
  var q = new URLSearchParams(location.search), app = q.get("app") === "factory" ? "factory" : "retail";
  var duong = (q.get("p") || (app === "retail" ? "tonkhotaisan/baoduong" : "")).replace(/^\/+/, "");
  fetch(GAS, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "xtLay", phien: phien }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || j.status !== "success") { bao((j && j.message) || "Không hỏi được địa chỉ."); return; }
      if (!j.url) { bao("Laptop chưa bật bản xem trước. Bật laptop, đợi khoảng 1 phút rồi mở lại link này."); return; }
      var m = {}, n = 0;
      try { for (var i = 0; i < ls.length; i++) { var k = ls.key(i), v = ls.getItem(k); if (v != null && v.length < 4000 && n < 30000) { m[k] = v; n += v.length + k.length; } } } catch (e) {}
      var g = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(m)))));
      location.replace(j.url + "/" + app + "/" + duong + "#mang=" + g);
    })
    .catch(function () { bao('Mạng lỗi — <a href="">thử lại</a>.'); });
})();
</script>
</body>
</html>
